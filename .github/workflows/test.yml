name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Agent / Dylan / Mark unit tests
        run: |
          python -m unittest \
            tests.test_dylan_m18 \
            tests.test_dylan_m19 \
            tests.test_dylan_m20 \
            tests.test_dylan_m21 \
            tests.test_risk_analyst \
            tests.test_agent_bridge_scan \
            tests.test_agent_platform \
            tests.test_mark_m10 \
            tests.test_agent_settings \
            tests.security.test_agent_security_m03 \
            tests.security.test_agent_security_m031 \
            -v

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build dashboard
        run: |
          npm ci
          npm run build
