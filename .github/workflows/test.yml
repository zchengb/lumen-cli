name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dylan / risk unit tests
        run: |
          python -m unittest tests.test_dylan_m18 tests.test_dylan_m19 tests.test_dylan_m20 tests.test_risk_analyst tests.test_agent_bridge_scan -v
